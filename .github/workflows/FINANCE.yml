name: Quality checks

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/windows/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/windows/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install OCR system dependencies for deterministic integration test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ind tesseract-ocr-eng poppler-utils fonts-dejavu-core

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/nexora-ci-test.db
          AUTO_CREATE_SCHEMA: 'false'
          JWT_SECRET: ci-only-secret-never-use-in-production
        run: python -m pytest -q

      - name: Compile Python modules
        run: python -m py_compile backend/app/main.py backend/app/recurring_worker.py backend/migrations/env.py

      - name: Check frontend JavaScript syntax
        run: node --check frontend/assets/app.js

      - name: Check Windows PowerShell script syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem scripts/windows -Filter '*.ps1' -File
          if (-not $scripts) { throw 'No Windows PowerShell scripts found.' }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $script.Name, $_.Message) }
              throw "PowerShell parse failed: $($script.Name)"
            }
            Write-Host "PowerShell syntax OK: $($script.Name)"
          }

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Validate migration chain on an empty database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/nexora-ci-migration.db
          AUTO_CREATE_SCHEMA: 'false'
          JWT_SECRET: ci-only-secret-never-use-in-production
        run: PYTHONPATH=. python -m alembic upgrade head
